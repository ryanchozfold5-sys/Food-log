<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>搵食日誌 v4.3.1 抬高避水印</title><link id="manifestLink" rel="manifest" href=""><meta name="theme-color" content="#0a0a0a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2962/2962160.png"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif;max-width:580px;margin:0 auto;padding:10px 12px 140px}.top{display:flex;gap:12px;margin:10px 0;align-items:center}.date-card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;height:58px;display:flex;align-items:center;padding:0 12px;flex:0.6}.date-card select{all:unset;width:100%;font-size:14px;color:#facc15;font-weight:800}.total-box{background:#151515;border:2.5px solid #facc15;border-radius:22px;height:132px;flex:1.4;display:flex;flex-direction:column;align-items:center;justify-content:center}.total-box b{color:#00ff88;font-size:30px;font-weight:900}.sec-title{margin:16px 4px 8px;color:#facc15;font-size:12px;font-weight:800;border-left:3px solid #facc15;padding-left:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid-6{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.card{background:#1c1c1e;border:1px solid #2c2c2e;border-radius:16px;min-height:82px;padding:6px 4px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}.card.active{border:2px solid #facc15;background:#2a2a1a}.card.empty{background:transparent;border:1px dashed #222;pointer-events:none}.card.no-click{pointer-events:none}.quick-bar{display:grid;grid-template-columns:62px 62px 62px 62px 62px 62px;gap:10px;margin:14px 0 6px;justify-content:start}.q{background:#2a2a2e;border:1px solid #3a3a3e;border-radius:14px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#facc15}.q small{font-size:10px;color:#888}.q b{font-size:18px}.q.big{background:#fde68a;color:#000;border:none}.q.empty{background:transparent;border:1px dashed #222;pointer-events:none}.q.au-red{background:#ff3b30;color:#fff;border:none}.q.au-red small,.q.au-red b{color:#fff}

.bottom{display:none;grid-template-columns:1fr 1.2fr;gap:10px;position:fixed;bottom:55px;left:0;right:0;max-width:580px;margin:0 auto;padding:10px 12px 12px;background:rgba(10,10,10,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #333;border-radius:18px;z-index:100;transform:translateY(120%);transition:transform 0.28s cubic-bezier(0.32,0.72,0,1);box-shadow:0 -10px 30px rgba(0,0,0,0.5)}
.bottom.show{display:grid;transform:translateY(0)}
.amt-box{background:#000;border:2px solid #facc15;border-radius:16px;height:56px;display:flex;align-items:center;padding:0 14px}.amt-box input{all:unset;width:100%;height:100%;font-size:19px;color:#fff;text-align:center}.amt-box input:disabled{color:#888}.btn{background:#facc15;color:#000;border:none;border-radius:16px;height:56px;font-size:18px;font-weight:900;z-index:31}.btn:disabled{background:#555;color:#999}.list{margin-top:10px}.triple-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.triple-col{background:#111;border:1px solid #222;border-radius:14px;padding:8px 8px;min-height:80px}.col-title{color:#facc15;font-size:11px;font-weight:800;text-align:center;margin-bottom:6px;border-bottom:1px solid #222;padding-bottom:4px}.row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #1e1e1e;font-size:12px}</style></head><body><div class="top"><div class="date-card"><select id="date" onchange="load()"></select></div><div class="total-box"><small style="color:#888;font-size:11px">實收營業額</small><b id="total">$0.00</b><small id="deductInfo" style="font-size:11px;color:#ff5555;margin-top:4px"></small></div></div><div class="sec-title">入帳</div><div class="grid" id="gridIncome"></div><div class="sec-title">隧道</div><div class="grid" id="gridTunnel"></div><div class="quick-bar"><div class="q"><small>P</small><b id="vP">0</b></div><div class="q"><small>Q</small><b id="vQ">0</b></div><div class="q"><small>R</small><b id="vR">0</b></div><div class="q big"><small>S=P+R</small><b id="vS">0</b></div><div class="q au-red"><small>T</small><b id="vT">-</b></div><div class="q empty"></div></div><div class="sec-title">支出</div><div class="grid" id="gridExpense"></div><div class="sec-title">氣錢 / 公里 / 氣站</div><div class="grid-6" id="grid6"></div><div class="bottom" id="bottomBar"><div class="amt-box"><input id="amount" type="number" inputmode="decimal" placeholder="連接中..."></div><button class="btn" id="btnSend" onclick="doAdd()">連接中...</button></div><div class="list" id="list"></div><script>
(function(){const manifest={name:"搵食日誌",short_name:"搵食日誌",display:"standalone",background_color:"#0a0a0a",theme_color:"#0a0a0a",start_url:"/",icons:[{src:"https://cdn-icons-png.flaticon.com/512/2962/2962160.png",sizes:"512x512",type:"image/png",purpose:"any maskable"}]};const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});document.getElementById('manifestLink').href=URL.createObjectURL(blob);if('serviceWorker' in navigator){const swCode="self.addEventListener('fetch', e=>e.respondWith(fetch(e.request))); self.addEventListener('install', e=>self.skipWaiting());";const swBlob=new Blob([swCode],{type:'text/javascript'});navigator.serviceWorker.register(URL.createObjectURL(swBlob));}})();
const BASE="https://script.google.com/macros/s/AKfycbyUjXlI8ZNg1jeWH6zVWlPcrPqePqWRqL9NemXsEy47fasiqDPOXfJ-7y708d4ASXic/exec";
const INCOME=["現金","uber","八達通","支付寶","Wonderpay","Soepay/Dash","uber現金","uber八達通","FPS","滴滴","的神","其他"];const TUNNEL_ORDER=["uber雙旦",null,"冇過任何隧道",null,"uber25蚊過海","uber25蚊過九龍","25蚊過海","25蚊過九龍","uber8蚊","uber20蚊","8蚊","20蚊","uber28蚊","uber16蚊停車場","28蚊","16蚊停車場"];const TUNNEL=TUNNEL_ORDER.filter(x=>x);const EXPENSE_ORDER=["易通行交欠款","代付","扣租","交租","泊車---卡","泊車---手機八達通","泊車---HKeMeter","抄牌","手機八達通---使用","支付寶---使用","八達通卡---使用","八達通錢包---使用","手機八達通---增值","支付寶---增值","八達通卡---增值","八達通錢包---增值","HSBC---收入","HSBC---支出",null,null,"東亞","星展","MPF","apps支出"];const EXPENSE=EXPENSE_ORDER.filter(x=>x);const GAS=["總公里","氣錢","升"];let selected="",lastPickedId="",isSending=false;window._grossTotal=0; window._tunnelCounts={}; window._gasBuf={}; window._lastSums={};window._yesterdayT=null; window._yesterdayLoaded=false; window._todayS=0; window._todayYiTongXing=0; window._todayT=0;window._shouldSaveT=false;
function hkDate(o=0){let hk=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Hong_Kong"}));hk.setDate(hk.getDate()-o);return hk;}
function initDate(){let s=document.getElementById("date");for(let i=0;i<35;i++){let d=hkDate(i);let val=String(d.getFullYear()).slice(-2)+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');let o=document.createElement("option");o.value=val;o.textContent=String(d.getDate()).padStart(2,'0')+"/"+String(d.getMonth()+1).padStart(2,'0')+"/"+d.getFullYear();s.appendChild(o);}s.selectedIndex=0;}
function fmt(p,v){let n=Number(v||0);if(p==="氣錢")return"$"+n.toFixed(2);if(p==="總公里")return n.toFixed(1)+"km";if(p==="升")return n.toFixed(2)+"L";if(TUNNEL.includes(p))return n.toString();return"$"+n.toFixed(2);}
function initGrid(){let h="";INCOME.forEach(p=>{h+="<div class=\"card\" id=\"c-"+p+"\" onclick=\"pick('"+p+"')\"><div class=\"name\">"+p+"</div><div class=\"amt\" id=\"a-"+p+"\" style=\"color:#facc15;font-weight:900;font-size:20px;margin-top:6px\">$0.00</div></div>";});document.getElementById("gridIncome").innerHTML=h;let h2="";TUNNEL_ORDER.forEach(p=>{if(p===null)h2+="<div class=\"card empty\"></div>";else h2+="<div class=\"card\" id=\"c-"+p+"\" onclick=\"pick('"+p+"')\"><div class=\"name\">"+p+"</div><div class=\"amt\" id=\"a-"+p+"\" style=\"color:#facc15;font-weight:900;font-size:20px;margin-top:6px\">0</div></div>";});document.getElementById("gridTunnel").innerHTML=h2;let h3="";EXPENSE_ORDER.forEach(p=>{if(p===null)h3+="<div class=\"card empty\"></div>";else h3+="<div class=\"card\" id=\"c-"+p+"\" onclick=\"pick('"+p+"')\"><div class=\"name\">"+p.replace(/---/g,"<br>")+"</div><div class=\"amt\" id=\"a-"+p+"\" style=\"color:#facc15;font-weight:900;font-size:20px;margin-top:6px\">$0.00</div></div>";});document.getElementById("gridExpense").innerHTML=h3;let h6="";GAS.forEach(p=>{h6+="<div class=\"card\" id=\"c-"+p+"\" onclick=\"pick('"+p+"')\"><div class=\"name\">"+p+"</div><div class=\"amt\" id=\"a-"+p+"\" style=\"color:#facc15;font-weight:900;font-size:20px;margin-top:6px\">$0.00</div></div>";});h6+="<div class=\"card no-click\"><div class=\"name\" style=\"font-size:10px;color:#aaa\">$ / km</div><div class=\"amt\" id=\"a-calc1\" style=\"color:#7dd3fc;font-weight:900;font-size:18px\">-</div></div><div class=\"card no-click\"><div class=\"name\" style=\"font-size:10px;color:#aaa\">km / L</div><div class=\"amt\" id=\"a-calc2\" style=\"color:#7dd3fc;font-weight:900;font-size:18px\">-</div></div>";document.getElementById("grid6").innerHTML=h6;}
function showBottom(){let b=document.getElementById("bottomBar");b.style.display="grid";requestAnimationFrame(()=>{requestAnimationFrame(()=>{b.classList.add("show");});});}
function hideBottom(){let b=document.getElementById("bottomBar");b.classList.remove("show");setTimeout(()=>{if(!b.classList.contains("show")) b.style.display="none";},280);}
function setBtn(l, txt){isSending=l;let b=document.getElementById("btnSend");let amtEl=document.getElementById("amount");b.disabled=l;if(amtEl){amtEl.disabled=l;if(l){amtEl.placeholder=txt||"傳送中...";amtEl.value="";} else {amtEl.placeholder="金額 / 次數";}}b.textContent=txt||(l?"傳送中...":"傳送");document.querySelectorAll(".card").forEach(c=>{if(c.classList.contains("no-click")||c.classList.contains("empty")){c.style.pointerEvents="none";return;}c.style.pointerEvents=l?"none":"auto";if(l) c.style.opacity="0.5"; else c.style.opacity="1";});}
function pick(p){if(isSending) return;if(GAS.includes(selected) &&!GAS.includes(p)){ window._gasBuf={}; updateCalcDisplays(); }let el=document.getElementById("c-"+p);if(el.classList.contains("active")){selected=""; lastPickedId="";document.querySelectorAll(".card").forEach(c=>{if(!c.classList.contains("no-click"))c.classList.remove("active");});document.getElementById("amount").value="";if(GAS.includes(p)){ window._gasBuf={}; updateCalcDisplays(); }hideBottom();return;}selected=p; lastPickedId="c-"+p;document.querySelectorAll(".card").forEach(c=>{if(!c.classList.contains("no-click"))c.classList.remove("active");});el.classList.add("active");if(TUNNEL.includes(p)) document.getElementById("amount").value="1";showBottom();setTimeout(()=>{ document.getElementById("amount").focus(); },180);}
function getYesterdayStr(todayStr){try{let parts=todayStr.split("-");let y=2000+Number(parts[0]),m=Number(parts[1])-1,d=Number(parts[2]);let dt=new Date(y,m,d);dt.setDate(dt.getDate()-1);return String(dt.getFullYear()).slice(-2)+"-"+String(dt.getMonth()+1).padStart(2,'0')+"-"+String(dt.getDate()).padStart(2,'0');}catch(e){return todayStr;}}
function load(){let d=document.getElementById("date").value;window._yesterdayT=null; window._yesterdayLoaded=false; window._todayS=0; window._shouldSaveT=false;window._gasBuf={};setBtn(true,"連接中...");document.getElementById("vT").textContent="讀取中...";let s1=document.createElement("script");s1.src=BASE+"?date="+d+"&callback=cbMain&_="+Date.now();document.body.appendChild(s1);let yd=getYesterdayStr(d);let sY=document.createElement("script");sY.src=BASE+"?date="+yd+"&callback=cbYesterdayT&_="+Date.now();document.body.appendChild(sY);}
function updateCalcDisplays(){let km=Number(window._gasBuf["總公里"]??window._lastSums?.["總公里"]??window._tunnelCounts?.["總公里"]??0);let gasMoney=Number(window._gasBuf["氣錢"]??window._lastSums?.["氣錢"]??window._tunnelCounts?.["氣錢"]??0);let liter=Number(window._gasBuf["升"]??window._lastSums?.["升"]??window._tunnelCounts?.["升"]??0);document.getElementById("a-calc1").textContent=(km>0&&gasMoney>0)?"$"+(gasMoney/km).toFixed(2):"-";document.getElementById("a-calc2").textContent=(liter>0&&km>0)?(km/liter).toFixed(2):"-";}
function tryComputeTDisplayOnly(){if(window._yesterdayT===null ||!window._yesterdayLoaded) return;let t = Number(window._yesterdayT||0) + Number(window._todayS||0) - Number(window._todayYiTongXing||0);window._todayT=t;document.getElementById("vT").textContent=t;}
function saveTNow(){let d=document.getElementById("date").value;let t=Number(window._todayT||0);let sc=document.createElement("script");sc.src=BASE+"?date="+d+"&action=saveT&amt="+encodeURIComponent(t)+"&callback=cbSaveT&_="+Date.now();document.body.appendChild(sc);}
function recalcTotal(){let ct=window._tunnelCounts||{};let P=(Number(ct["uber25蚊過海"]||0)+Number(ct["uber25蚊過九龍"]||0))*25+Number(ct["uber8蚊"]||0)*8+Number(ct["uber20蚊"]||0)*20+Number(ct["uber28蚊"]||0)*28;let R=(Number(ct["25蚊過海"]||0)+Number(ct["25蚊過九龍"]||0))*25+Number(ct["8蚊"]||0)*8+Number(ct["20蚊"]||0)*20+Number(ct["28蚊"]||0)*28;let S=P+R;document.getElementById("vP").textContent=P;document.getElementById("vQ").textContent=P+Number(ct["uber16蚊停車場"]||0)*16;document.getElementById("vR").textContent=R;document.getElementById("vS").textContent=S;window._todayS=S;window._todayYiTongXing=Number(ct["易通行交欠款"]||0);let uberShuangDan = Number(ct["uber雙旦"]||0)*25;document.getElementById("total").textContent="$"+(Number(window._grossTotal||0)-R+uberShuangDan).toFixed(2);document.getElementById("deductInfo").textContent="S$"+S+" +雙旦$"+uberShuangDan;tryComputeTDisplayOnly();}
function finishAndBounce(){setBtn(false);hideBottom();if(window._shouldSaveT){ window._shouldSaveT=false; saveTNow(); }if(lastPickedId){let el=document.getElementById(lastPickedId);document.querySelectorAll(".card").forEach(c=>{if(!c.classList.contains("no-click"))c.classList.remove("active");});selected="";if(el){setTimeout(()=>{el.scrollIntoView({behavior:"smooth",block:"center"});},150);}lastPickedId="";}}
function cbMain(r){let sums=r.sums||{},counts=r.counts||{};window._tunnelCounts=counts; window._lastSums=sums; window._grossTotal=Number(r.total||0);INCOME.forEach(p=>{let el=document.getElementById("a-"+p);if(el)el.textContent="$"+Number(sums[p]||0).toFixed(2);});[...TUNNEL,...EXPENSE].forEach(p=>{let el=document.getElementById("a-"+p);if(el)el.textContent=fmt(p,counts[p]??sums[p]??0);});GAS.forEach(p=>{let el=document.getElementById("a-"+p);if(!el)return;let v=(window._gasBuf[p]!=null? window._gasBuf[p] : (sums[p]?? counts[p]?? 0));el.textContent=fmt(p,v);});window._l3=r.list||[]; recalcTotal(); updateCalcDisplays(); render(); finishAndBounce();}
function cbYesterdayT(r){window._yesterdayT=Number(r.t??r.T??r.au??0);window._yesterdayLoaded=true;tryComputeTDisplayOnly();}
function cbSaveT(r){}
function render(){let l3=window._l3||[];if(!l3.length){document.getElementById("list").innerHTML='<div class="triple-list"><div class="triple-col"><div class="col-title">入帳</div><div style="color:#444;font-size:12px;text-align:center">無紀錄</div></div><div class="triple-col"><div class="col-title">隧道</div><div style="color:#444;font-size:12px;text-align:center">無紀錄</div></div><div class="triple-col"><div class="col-title">支出</div><div style="color:#444;font-size:12px;text-align:center">無紀錄</div></div></div>';return;}let incomeList = l3.filter(r=> INCOME.includes(r.pay));let tunnelList = l3.filter(r=> TUNNEL.includes(r.pay) || r.pay==="易通行交欠款");let expenseList = l3.filter(r=> EXPENSE.includes(r.pay) || GAS.includes(r.pay) || r.pay==="T");let mk = (arr)=>{if(!arr.length) return '<div style="color:#333;font-size:11px;text-align:center;padding:10px 0">-</div>';return arr.map(r=>{if(r.pay==="T") return '<div class="row" style="color:#ff5555"><span>T結存</span><span>'+r.amt+'</span></div>';if(GAS.includes(r.pay)) return '<div class="row" style="color:#7dd3fc"><span>'+r.pay+'</span><span>'+fmt(r.pay,r.amt)+'</span></div>';return '<div class="row"><span>'+r.pay+'</span><span>'+r.amt+'</span></div>';}).join("");};document.getElementById("list").innerHTML='<div class="triple-list"><div class="triple-col"><div class="col-title">入帳</div>'+mk(incomeList)+'</div><div class="triple-col"><div class="col-title">隧道</div>'+mk(tunnelList)+'</div><div class="triple-col"><div class="col-title">支出</div>'+mk(expenseList)+'</div></div>';}
function doAdd(){if(isSending) return;let amtEl=document.getElementById("amount"), amt=amtEl.value.trim(), d=document.getElementById("date").value;if(!selected){alert("揀分類先");return;}if(TUNNEL.includes(selected) || selected==="易通行交欠款"){ window._shouldSaveT=true; } else { window._shouldSaveT=false; }if(GAS.includes(selected)){if(!amt){alert("入數先");amtEl.focus();return;}window._gasBuf[selected]=amt;document.getElementById("a-"+selected).textContent=fmt(selected,amt);updateCalcDisplays();if(selected==="總公里"){selected="氣錢";document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));document.getElementById("c-氣錢").classList.add("active");lastPickedId="c-氣錢";amtEl.value="";setTimeout(()=>{ amtEl.focus(); }, 150);return;}if(selected==="氣錢"){selected="升";document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));document.getElementById("c-升").classList.add("active");lastPickedId="c-升";amtEl.value="";setTimeout(()=>{ amtEl.focus(); }, 150);return;}if(selected==="升"){let buf={...window._gasBuf};if(!buf["總公里"]||!buf["氣錢"]||!buf["升"]){alert("要入齊三個先");return;}setBtn(true,"寫入 1/3...");window._gasBuf={};let failSafe=setTimeout(()=>{ setBtn(false); load(); }, 7000);let sc1=document.createElement("script");window.cbGasStep1 = function(r){setBtn(true,"寫入 2/3...");setTimeout(()=>{let sc2=document.createElement("script");window.cbGasStep2 = function(r2){setBtn(true,"寫入 3/3...");setTimeout(()=>{clearTimeout(failSafe);let sc3=document.createElement("script");sc3.src=BASE+"?action=add&date="+d+"&pay="+encodeURIComponent("升")+"&amt="+encodeURIComponent(buf["升"])+"&callback=cbMain&_="+Date.now();document.body.appendChild(sc3);}, 1800);};sc2.src=BASE+"?action=add&date="+d+"&pay="+encodeURIComponent("氣錢")+"&amt="+encodeURIComponent(buf["氣錢"])+"&callback=cbGasStep2&_="+Date.now();document.body.appendChild(sc2);}, 1800);};sc1.src=BASE+"?action=add&date="+d+"&pay="+encodeURIComponent("總公里")+"&amt="+encodeURIComponent(buf["總公里"])+"&callback=cbGasStep1&_="+Date.now();document.body.appendChild(sc1);document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));selected=""; lastPickedId=""; amtEl.value="";return;}}setBtn(true,"傳送中...");let sc=document.createElement("script");sc.src=BASE+"?action=add&date="+d+"&pay="+encodeURIComponent(selected)+"&amt="+encodeURIComponent(amt||"1")+"&callback=cbMain&_="+Date.now();document.body.appendChild(sc);amtEl.value="";}
initDate();initGrid();load();
</script></body></html>
